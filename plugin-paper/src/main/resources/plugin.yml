name: AetherScript
version: ${version}
main: dev.aetherscript.paper.AetherScriptPlugin
api-version: '26.3'
description: Bounded scripts with transactional in-memory hot reload
commands:
  ais:
    description: AetherScript local administration and feature dispatch
    usage: /ais <status|list|validate|reload|run> [feature]
permissions:
  aetherscript.admin:
    default: op
  aetherscript.example.hello:
    default: op
