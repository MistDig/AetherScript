name: AetherScript
version: ${version}
main: dev.aetherscript.paper.AetherScriptPlugin
api-version: '26.3'
description: Bounded scripts with transactional in-memory hot reload
softdepend: [Vault, WorldGuard]
commands:
  ais:
    description: AetherScript local administration and feature dispatch
    usage: /ais <status|list|validate|reload|run|history|diff|rollback|permit|restrict|capabilities|connect|connections|disconnect|pair|unpair> [feature]
permissions:
  aetherscript.admin:
    default: op
  aetherscript.example.hello:
    default: op
  aetherscript.example.home:
    default: op
