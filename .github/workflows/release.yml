name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and test
        run: ./gradlew --no-daemon clean check build
      - name: Verify packaged MCP process
        run: python integration-tests/mcp_stdio.py
      - name: Prepare release and verify tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/prepare_release.py --tag "$RELEASE_TAG"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          build/release/*.jar build/release/*-source.zip build/release/SHA256SUMS.txt
          --verify-tag --title "AetherScript $RELEASE_TAG"
          --notes-file build/release/NOTES.md --latest
