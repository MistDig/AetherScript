name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci --prefix relay
      - run: npm test --prefix relay
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon clean check build
      - run: python integration-tests/ai_authoring.py
      - run: python integration-tests/storage_package.py
      - run: python integration-tests/legacy_ir.py
      - run: python integration-tests/wiki_examples.py
      - run: node site/scripts/sync.mjs
      - run: python integration-tests/docs_consistency.py
