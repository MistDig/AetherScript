name = "aetherscript-relay"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[durable_objects]
bindings = [{ name = "SESSIONS", class_name = "RelaySession" }, { name = "DIRECTORY", class_name = "ServerDirectory" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelaySession"]


[[migrations]]
tag = "v2"
new_sqlite_classes = ["ServerDirectory"]
